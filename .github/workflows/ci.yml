name: Windows checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -c "from pathlib import Path; from desktop_service import defaults; defaults(Path.cwd())"
      - run: python -X utf8 -B -m unittest discover -s tests -p "test_*.py"
      - run: powershell -ExecutionPolicy Bypass -File tray/build.ps1
